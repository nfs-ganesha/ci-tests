- job:
    name: ltp-cephfs
    node: cico-workspace
    description: 'Run LTP tests on ceph FSAL.'
    project-type: freestyle
    concurrent: false
    allow-manual-triggers: true
    disabled: true

    scm:
    - ci-tests

    parameters:
    - string:
        default: "$WORKSPACE/ci-tests/build_scripts/common/basic-ceph-server.sh"
        description: Test script to execute on the reserved machine acting as a server.
        name: SERVER_TEST_SCRIPT
    - string:
        default: "$WORKSPACE/ci-tests/build_scripts/ltp/run-ltp-tests.sh"
        description: Test script to execute on the reserved machine acting as a client.
        name: CLIENT_TEST_SCRIPT

    builders:
    - get-node
    - shell: !include-raw-verbatim: scripts/common.sh

    wrappers:
    - gerrithub_key
    - cleanup-ws

    publishers:
    - post_build_task_return-node
