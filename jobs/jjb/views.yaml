- view:
    name: Gatecheck Tests
    view-type: list
    description: 'Jobs related to patchset testing and validation'
    job-name:
      - gatecheck-trigger-gerrithub
    columns:
      - status
      - weather
      - job
      - last-success
      - last-failure
      - last-duration
      - build-button
      - favorite
    recurse: false

- view:
    name: Dev Tests
    view-type: list
    description: 'Development and testing jobs'
    regex: 'dev-.*'
    columns:
      - status
      - weather
      - job
      - last-success
      - last-failure
