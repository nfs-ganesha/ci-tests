- job:
    name: pjdfs-cephfs
    node: cico-workspace
    description: 'Run pjdfs tests against the latest build of Ganesha with FSAL_CEPH.'
    project-type: freestyle
    concurrent: false
    allow-manual-triggers: true
    disabled: true

    scm:
    - ci-tests

    parameters:
    - string:
        default: "$WORKSPACE/ci-tests/ceph/basic-ceph-pjdfs.sh"
        description: Test script to execute on the reserved machine acting as a server.
        name: SERVER_TEST_SCRIPT

    builders:
    - get-node
    - shell: !include-raw-verbatim: scripts/common.sh

    wrappers:
    - cleanup-ws

    publishers:
    - post_build_task_return-node
